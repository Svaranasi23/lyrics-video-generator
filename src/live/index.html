<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sing Along</title>
<style>
  :root { --bg:#faf6ee; --panel:#fff; --ink:#2b2118; --muted:#8a7c6c; --line:#e9e0d0; --accent:#b5541b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17130f; --panel:#211b15; --ink:#f1e8da; --muted:#a39380; --line:#3a3027; --accent:#e08a4f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans", system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; color:inherit; text-decoration:none; }
  .card:hover { border-color:var(--accent); }
  .card .native { font-size:22px; font-weight:600; } .card .title { font-size:17px; } .card .blurb { color:var(--muted); font-size:14px; margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>Sing Along</h1>
  <p class="sub">Pick a collection.</p>
  <div id="list"></div>
</main>
<script src="collections.js"></script>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cols = window.COLLECTIONS || [];
document.getElementById("list").innerHTML = cols.map((c) =>
  `<a class="card" href="player.html?c=${encodeURIComponent(c.slug)}">${c.native ? `<div class="native">${esc(c.native)}</div>` : ""}` +
  `<div class="title">${esc(c.title)}</div>${c.blurb ? `<div class="blurb">${esc(c.blurb)}</div>` : ""}</a>`).join("") ||
  "<p class='sub'>No collections yet. Add one in collections.js.</p>";
</script>
</body>
</html>
